[Service]
ExecStartPost=sh -c 'echo "model0 = $(upsc apc1500@localhost device.model 2>/dev/null)" | sudo tee /dev/anyon_e_battery'
ExecStartPost=sh -c 'echo "manufacturer0 = $(upsc apc1500@localhost device.manufacturer 2>/dev/null)" | sudo tee /dev/anyon_e_battery'
ExecStartPost=sh -c 'echo "serial0 = $(upsc apc1500@localhost device.serial 2>/dev/null)" | sudo tee /dev/anyon_e_battery'
